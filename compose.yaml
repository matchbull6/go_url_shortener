name: go_url_shortener

services:
  app:
    build: .
    image: go_url_shortener:latest
    restart: unless-stopped
    environment:
      GOMEMLIMIT: "110MiB"

      ADDR: ":8080"
      BASE_URL: "http://localhost:8080"
      STORAGE: ${STORAGE:-memory}
      CODE_LENGTH: "7"
      DATABASE_URL: "postgres://shortener:${APP_DB_PASSWORD:-}@postgres:5432/shortener?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: shortener
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shortener"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m


volumes:
  postgres-data:
