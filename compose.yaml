name: go_url_shortener

services:
  app:
    build: .
    image: go_url_shortener:latest
    restart: unless-stopped
    environment:
      GOMEMLIMIT: "110MiB"
      ADDR: ":8080"
      BASE_URL: "http://localhost:8080"
      STORAGE: "memory"
      CODE_LENGTH: "7"
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
